{% extends "base.html" %}

{% block title %}Student Registration - Hostel Bites{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 550px;">
  <div class="auth-header">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📝</div>
    <h2>Student Registration</h2>
    <p>Create your student account to get food delivered to your room</p>
  </div>

  <form action="{{ url_for('register') }}" method="POST">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input
          type="text"
          name="name"
          class="form-control"
          placeholder="e.g. Bhanu Prakash"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">College Roll Number</label>
        <input
          type="text"
          name="roll_no"
          class="form-control"
          placeholder="e.g. 23CS0150"
          required
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">College Email</label>
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="bhanu@college.edu"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input
          type="tel"
          name="phone"
          class="form-control"
          placeholder="10-digit mobile number"
          required
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Hostel Block</label>
        <select name="hostel_block" class="form-control" required>
          {% for h in hostels %}
            <option value="{{ h }}">{{ h }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Room Number</label>
        <input
          type="text"
          name="room_no"
          class="form-control"
          placeholder="e.g. 302, B-12"
          required
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Create Password</label>
        <input
          type="password"
          name="password"
          class="form-control"
          placeholder="At least 6 characters"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input
          type="password"
          name="confirm_password"
          class="form-control"
          placeholder="Re-enter password"
          required
        >
      </div>
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
      Register & Start Ordering
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
    Already registered?
    <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">Login here</a>
  </div>
</div>
{% endblock %}
